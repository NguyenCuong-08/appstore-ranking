name: Sync ranks & metadata

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync-ranks
        run: >
          curl -fsS --retry 3 --retry-delay 30
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "https://${{ vars.VERCEL_PROD_URL }}/api/cron/sync-ranks"
      - name: Call /api/cron/sync-metadata
        run: >
          curl -fsS --retry 3 --retry-delay 30
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "https://${{ vars.VERCEL_PROD_URL }}/api/cron/sync-metadata"
